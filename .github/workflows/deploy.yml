# On every push to main: SSH into the server and run deploy/setup-server.sh (pull, build, publish).
# Repository → Settings → Secrets and variables → Actions → add:
#   SSH_HOST  server IP (185.220.204.136)
#   SSH_KEY   private SSH key whose public key is in /root/.ssh/authorized_keys on the server
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: echo "ready=$([ -n "$SSH_HOST" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: steps.check.outputs.ready == 'yes'
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "root@$SSH_HOST" \
            'curl -fsSL https://raw.githubusercontent.com/SultonbekovSarvarbek/beat-earth/main/deploy/setup-server.sh | bash'

      - name: Secrets missing
        if: steps.check.outputs.ready != 'yes'
        run: echo "::warning::SSH_HOST / SSH_KEY are not set — nothing was deployed."
