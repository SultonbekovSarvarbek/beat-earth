# beat-earth-api.happybox.uz — reverse proxy to Supabase (REST, RPC, Auth, Realtime websockets)
# Put in /etc/nginx/sites-available/beat-earth-api.happybox.uz and symlink into sites-enabled.
# HTTPS: sudo certbot --nginx -d beat-earth-api.happybox.uz
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name beat-earth-api.happybox.uz;

    client_max_body_size 5m;

    location / {
        proxy_pass https://lnfexdqwuesayswkshdi.supabase.co;
        proxy_http_version 1.1;

        # Supabase routes by host name and needs SNI
        proxy_set_header Host lnfexdqwuesayswkshdi.supabase.co;
        proxy_ssl_server_name on;
        proxy_ssl_name lnfexdqwuesayswkshdi.supabase.co;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime (websockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # keep redirects (e.g. OAuth) pointing at the real Supabase host
        proxy_redirect off;
        proxy_buffering off;
    }
}
