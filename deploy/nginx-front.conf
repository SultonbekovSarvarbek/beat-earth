# beat-earth.happybox.uz — static frontend (built files from web/dist)
# Put in /etc/nginx/sites-available/beat-earth.happybox.uz and symlink into sites-enabled.
# HTTPS: sudo certbot --nginx -d beat-earth.happybox.uz
server {
    listen 80;
    server_name beat-earth.happybox.uz;

    root /var/www/beat-earth;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # hashed assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # single-page app: every path serves index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
